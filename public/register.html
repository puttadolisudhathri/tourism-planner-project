<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Tourism Planner</title>

    <link rel="stylesheet" href="/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>🌍 Tourism Planner</h1>

            <h2>Create Account</h2>

            <p class="welcome-text">
                Create an account to start planning your trip
            </p>


            <form id="registerForm">

                <!-- NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <!-- REGISTER BUTTON -->

                <button type="submit">
                    Register
                </button>

            </form>


            <p class="account-text">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="/auth.js"></script>

</body>

</html>
